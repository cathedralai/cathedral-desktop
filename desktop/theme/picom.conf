# Cathedral compositor: soft shadows, small rounded corners, quick fades. xrender runs fine on Xvfb.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'tint2'", "_GTK_FRAME_EXTENTS@:c" ];
corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'tint2'" ];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;
inactive-opacity = 1.0;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
use-ewmh-active-win = true;
