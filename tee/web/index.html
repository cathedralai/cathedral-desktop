<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cathedral sealed desktop</title>
<style>
  :root { --bg: #000; --panel: #0B0D11; --line: #222831; --ink: #ECE9E1; --body: #D6D2C8; --mute: #8E9AA6; --acc: #F06E4A; --ok: #3DD68C; --bad: #FF6B7D; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--body); font: 14px/1.4 Inter, system-ui, -apple-system, sans-serif; }
  body { display: grid; grid-template-rows: 44px 1fr auto; }
  #hosted { position: relative; z-index: 10; overflow-wrap: anywhere; padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--line); color: var(--body); font: 12px/1.4 "JetBrains Mono", ui-monospace, monospace; }
  header { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mark { color: var(--ink); font-weight: 600; } .mark span { color: var(--mute); font-weight: 400; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font: 12px/1 "JetBrains Mono", ui-monospace, monospace; color: var(--mute); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
  .on .dot { background: var(--ok); } .off .dot { background: var(--bad); } .wait .dot { background: var(--acc); }
  .chip b { color: var(--body); font-weight: 500; }
  .right { margin-left: auto; display: flex; gap: 10px; }
  main { position: relative; min-height: 0; } #screen { position: absolute; inset: 0; } #screen canvas { outline: none; }
  .note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; width: min(520px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .note h2 { margin: 0 0 6px; font-size: 16px; color: var(--ink); font-weight: 600; } .note p { margin: 0 0 8px; color: var(--mute); font-size: 13px; }
  .note code { font: 12px "JetBrains Mono", monospace; color: var(--body); word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="mark">Cathedral <span>sealed desktop</span></div>
  <div id="attest" class="chip wait"><i class="dot"></i><span id="attest-text">verifying</span></div>
  <div id="link" class="chip wait"><i class="dot"></i><span id="link-text">connecting</span></div>
  <div class="right"><span class="chip" id="room" hidden>room <b id="room-id"></b></span></div>
</header>
<main>
  <div id="screen"></div>
  <div id="gone" class="note" hidden>
    <h2 id="gone-title">Not connected</h2>
    <p id="gone-why"></p>
    <p><code id="gone-detail"></code></p>
  </div>
</main>
<div id="hosted" role="note">Whoever serves this page, even through a tunnel, can see your screen.</div>
<script type="module">
  // Query: relay=ws(s)://host:port (websockify to the box's 8444), target=vnc|job, room=ID,
  //        fp=HEX[,HEX] allowed measurements (required: without it the page refuses unless nofp=1),
  //        nofp=1 accept any build, shown as ANY BUILD ACCEPTED (to learn a fingerprint). There is no dev switch: a box without a report is always refused here.
  //        certs=URL base serving vcek.der for the chip (optional; else the box's certs or KDS via `kds=`),
  // Fragment (after #, never sent to the relay, removed from the address bar on load):
  //        ticket=<single-use ticket from mint_ticket.py, one per view: a reload needs a fresh one>,
  //        vncpw=<only for a box whose x11vnc has a password>.
  import { SealedStream, websocketPipe } from './sealed-stream.js';
  import { readLink, cleanSearch, linkProblem, hostedLabel } from './link.js';
  const link = readLink(location);
  // First, before anything is fetched or connected: the link has no say in whether this shows.
  document.getElementById('hosted').textContent = hostedLabel(location);
  // The fragment holds a single-use ticket and maybe a password; take it out of the address bar and history entry.
  if (location.hash || link.misplaced.length) history.replaceState(null, '', location.pathname + cleanSearch(location.search));
  const { relay, target, allowed } = link;
  const set = (id, cls, text) => { const el = document.getElementById(id); el.className = 'chip ' + cls; document.getElementById(id + '-text').textContent = text; };
  const gone = (title, why, detail = '') => { document.getElementById('gone-title').textContent = title; document.getElementById('gone-why').textContent = why; document.getElementById('gone-detail').textContent = detail; document.getElementById('gone').hidden = false; };
  if (link.room) { document.getElementById('room-id').textContent = link.room.slice(0, 8); document.getElementById('room').hidden = false; }
  const fetchDer = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer());
  const verify = { allowedMeasurements: allowed, allowAnyMeasurement: link.nofp, product: link.product,
    certs: { ark: await fetchDer('./fixtures/amd-genoa-ark.der').catch(() => undefined), ask: await fetchDer('./fixtures/amd-genoa-ask.der').catch(() => undefined) },
    fetchVcek: link.kds ? (url) => fetchDer(link.kds + encodeURIComponent(url)) : (link.certs ? () => fetchDer(link.certs + '/vcek.der') : undefined) };
  try {
    const problem = linkProblem(link);
    if (problem) throw Object.assign(new Error(problem.detail), problem);
    const pipe = websocketPipe(relay);
    await pipe.ready;
    const stream = await SealedStream.open({ pipe, target, ticket: link.ticket, verify, onstatus: (m) => {
      if (m.startsWith('attested')) set('attest', allowed.length ? 'on' : 'wait', m);
      else set('link', 'wait', m);
    } });
    const a = stream.attestation;
    if (a?.ok) set('attest', allowed.length ? 'on' : 'wait', `attested · ${a.measurement.slice(0, 12)}… · chip ${a.chipId.slice(0, 8)}${a.testMode ? ' · ANY BUILD ACCEPTED' : ''}`);
    set('link', 'on', `sealed ${target}`);
    window.sealedStream = stream;
    if (target === 'vnc') {
      const { default: RFB } = await import('./core/rfb.js');
      const rfb = new RFB(document.getElementById('screen'), SealedStream.websocketLike(stream),
                          link.vncpw ? { credentials: { password: link.vncpw } } : undefined);
      rfb.scaleViewport = true; rfb.background = '#000';
      rfb.addEventListener('connect', () => { set('link', 'on', `sealed ${target}`); rfb.focus(); });
      // A box whose x11vnc wants a password: ask for it rather than letting the session time out.
      // A TEE box runs x11vnc with no password; the sealed stream is the gate.
      rfb.addEventListener('credentialsrequired', () => {
        set('link', 'wait', 'desktop password');
        const pw = window.prompt('This desktop asks for a VNC password.');
        if (pw === null) { stream.close(); gone('Not connected', 'The desktop needs a password.'); return; }
        rfb.sendCredentials({ password: pw });
      });
      rfb.addEventListener('securityfailure', (e) => { set('link', 'off', 'refused'); gone('Refused', 'The desktop refused the password.', e.detail?.reason || ''); });
      rfb.addEventListener('disconnect', (e) => { set('link', 'off', 'offline'); gone('Disconnected', stream.error || !e.detail?.clean ? 'The stream dropped.' : 'The box closed the desktop.', stream.error?.message || ''); });
    } else {
      stream.onmessage = (pt) => { const el = document.createElement('pre'); el.textContent = new TextDecoder().decode(pt); document.getElementById('screen').appendChild(el); };
      stream.onclose = (err) => { set('link', 'off', 'offline'); gone('Disconnected', err ? 'The stream dropped.' : 'The box closed the stream.', err?.message || ''); };
      stream.send(new TextEncoder().encode('JOB 1\n'));
    }
  } catch (e) {
    set('link', 'off', 'refused');
    set('attest', 'off', 'not attested');
    gone(e.title || 'Refused', e.why || 'This page will not show a desktop it cannot check.', e.message);
  }
</script>
</body>
</html>
